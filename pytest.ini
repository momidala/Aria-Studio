[pytest]
# Run all Python tests without Blender installed.
# tests/unit/      — 20 unit tests (coordinate conversion, code generation)
# tests/regression — 10 regression tests (Fixes #2, #3, #4, #8)
#
# Tests are kept outside blender-addon/ so pytest never touches
# blender-addon/__init__.py (which imports bpy unconditionally — correct
# Blender behavior, but must not run in the test runner).
# conftest.py adds blender-addon/ to sys.path so core/ is importable directly.
testpaths = tests/unit tests/regression
